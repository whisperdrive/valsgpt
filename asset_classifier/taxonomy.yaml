# Machinery & equipment taxonomy: sector -> major category -> asset class.
#
# DRAFT. The structure follows the way ASA's Machinery & Technical Specialties
# material organises assets (by industry, then by asset type), but it was
# written from general knowledge, NOT copied from ASA's licensed tables.
# Review the class list against the ASA Estimated Normal Useful Life Study
# before relying on it, and add normal useful lives and index series there.
#
# Per category:  gl   = general ledger account names seen for these assets
#                cost = [low, high] typical historical cost, used for synthetic rows
# Per class:     items = equipment nouns, makes = manufacturers (optional)
# Class names must be unique across the whole file.

