# Asset taxonomy, version 2: sector -> asset classification -> asset class.
#
# The top two levels follow the sector and asset classification headings of the
# ASA Machinery & Technical Specialties Committee "Estimated Normal Useful Life
# Study" (2024). Only those headings are used here. The study's asset lists and
# normal useful life figures are ASA's copyright and are NOT in this file.
#
# basis: asa        the classification heading comes from the ASA study
# basis: extension  added here because the ASA study has no place for it
# Sectors named "(not in ASA study)" are extensions as a whole.
#
# The third level (asset class) and its items and makes vocabulary are this
# project's own. How each class was placed under an ASA heading is a judgment
# made for this project and has not been reviewed by an appraiser.
#
# Per classification: gl = ledger account names, cost = [low, high] typical cost.
# Class names must be unique across the file.

